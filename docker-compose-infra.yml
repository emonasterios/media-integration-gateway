services:
  media-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-integration-gateway
    restart: unless-stopped
    ports:
      - "9193:8000"
    volumes:
      - gateway-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gateway.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
