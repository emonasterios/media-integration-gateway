services:
  media-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-integration-gateway
    restart: unless-stopped
    ports:
      - "9193:8000"
    volumes:
      - gateway-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gateway.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info

volumes:
  gateway-data:
